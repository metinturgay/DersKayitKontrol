<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danışman Özeti — Ders Kayıt</title>
<style>
/* =====================================================================
   Tasarim belirtecleri. Tek yerden renk/olcu; koyu tema yalnizca bu
   blogu yeniden tanimliyor, bilesenlerin hicbiri sabit renk yazmiyor.
   Pano cevrimdisi tek dosya: web fontu, CDN, resim yok.
   ===================================================================== */
:root{
  color-scheme:light dark;
  --zemin:#f5f7fa;  --kart:#fff;  --kart2:#fafbfc;  --uzak:#eef1f5;
  --cizgi:#dfe3e9;  --cizgi2:#eef0f3;
  --metin:#111827;  --soluk:#667085;  --cok-soluk:#98a2b3;
  --vurgu:#3457d5;  --vurgu-zemin:#eef2ff;  --vurgu-kenar:#c7d2fe;
  --kirmizi:#b42318; --kirmizi-bg:#fef3f2; --kirmizi-kenar:#f7b5ae;
  --amber:#b54708;   --amber-bg:#fffaeb;   --amber-kenar:#fdd670;
  --yesil:#067647;   --yesil-bg:#ecfdf3;   --yesil-kenar:#86e0ae;
  --gri:#475467;     --gri-bg:#f2f4f7;
  --isaret:#fde68a;  --isaret-metin:#452c03;
  --ust:#111827;  --ust-metin:#f9fafb;  --ust-soluk:#9ba3af;
  --golge:0 1px 2px rgba(16,24,40,.06);
  --golge2:0 8px 24px -6px rgba(16,24,40,.14);
  --r:10px; --r2:7px; --r3:5px;
}
@media (prefers-color-scheme:dark){
  :root{
    --zemin:#0d1117;  --kart:#161b22;  --kart2:#1b212a;  --uzak:#1b212a;
    --cizgi:#2c333d;  --cizgi2:#232a33;
    --metin:#e6edf3;  --soluk:#9aa6b2;  --cok-soluk:#6e7a87;
    --vurgu:#7d9bff;  --vurgu-zemin:#1a2340;  --vurgu-kenar:#33406b;
    --kirmizi:#ff9a8f; --kirmizi-bg:#2b1614; --kirmizi-kenar:#6d2b23;
    --amber:#f3c05c;   --amber-bg:#2a2113;   --amber-kenar:#6f541b;
    --yesil:#6fdda0;   --yesil-bg:#10241a;   --yesil-kenar:#215e3d;
    --gri:#aab4c0;     --gri-bg:#1f262e;
    --isaret:#8a6d1f;  --isaret-metin:#fff7e0;
    --ust:#161b22;  --ust-metin:#e6edf3;  --ust-soluk:#8b949e;
    --golge:0 1px 2px rgba(0,0,0,.4);
    --golge2:0 8px 24px -6px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",
     Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--metin);
     background:var(--zemin);
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;
     border-radius:var(--r3)}

/* ---- ust serit ---- */
.ust{display:flex;align-items:center;gap:16px;padding:11px 20px;
     background:var(--ust);color:var(--ust-metin);
     border-bottom:1px solid rgba(255,255,255,.06)}
.ust h1{font-size:14px;letter-spacing:.3px;white-space:nowrap}
/* Pano hangi BOLUMUN kurallariyla uretildigini soylemeli. Exe bolume
   ozgudur: Matematik icin derlenmis bir exe Fizik danismaninin
   elinde her sayiyi yanlis hesaplar ve bunu hicbir yerde yazmazdi. */
.ust .bolum-ad{font-size:11px;font-weight:650;padding:2px 8px;
     border-radius:99px;background:rgba(255,255,255,.10);
     color:var(--ust-metin);white-space:nowrap;letter-spacing:.2px;
     overflow:hidden;text-overflow:ellipsis;max-width:38vw}
/* Dar pencerede serit tasmasin: tarih/okuma bilgisi KISILIR ama
   gizlenmez - "bu pano ne kadar taze" sorusunun cevabi orada ve
   panonun dogru okunmasi buna bagli. Sayaclar hic kucultulmez. */
.ust .alt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ust .alt{font-size:12px;color:var(--ust-soluk);display:flex;
     align-items:center;gap:8px;flex-wrap:wrap}
.ust .sayac{margin-left:auto;display:flex;gap:8px;flex:none}
.ust .sayac div{min-width:62px;padding:3px 10px;border-radius:var(--r2);
     background:rgba(255,255,255,.06);text-align:center;font-size:11px;
     color:var(--ust-soluk);line-height:1.3}
.ust .sayac b{font-size:16px;display:block;font-weight:650;
     color:var(--ust-metin);font-variant-numeric:tabular-nums}
.ust .sayac .y b{color:#fca5a5}
.ust .sayac .d b{color:#fcd34d}
.ust .sayac .t b{color:#86efac}

.duzen{display:flex;height:calc(100vh - 44px)}

/* ---- sol panel ---- */
.yan{width:340px;flex:none;background:var(--kart);
     border-right:1px solid var(--cizgi);display:flex;flex-direction:column;
     min-height:0}
.yan-baslik{font-size:10px;font-weight:700;letter-spacing:.9px;
     text-transform:uppercase;color:var(--cok-soluk);padding:12px 14px 5px}
.yonetici-dugme{display:block;width:calc(100% - 16px);margin:0 8px 3px;
     padding:7px 10px;border:1px solid transparent;background:transparent;
     border-radius:var(--r2);cursor:pointer;font-size:12.5px;font-weight:550;
     color:var(--metin);text-align:left;line-height:1.35}
.yonetici-dugme small{display:block;font-size:11px;font-weight:400;
     color:var(--soluk);margin-top:1px}
.yonetici-dugme:hover{background:var(--uzak)}
.yonetici-dugme.aktif{background:var(--vurgu-zemin);color:var(--vurgu);
     border-color:var(--vurgu-kenar)}
.yonetici-dugme.aktif small{color:var(--vurgu)}

.arama{padding:10px 12px 8px;border-top:1px solid var(--cizgi2);margin-top:6px}
.arama input{width:100%;padding:8px 11px;border:1px solid var(--cizgi);
     border-radius:var(--r2);font:inherit;background:var(--kart2);
     color:var(--metin)}
.arama input::placeholder{color:var(--cok-soluk)}
.arama input:focus{outline:none;border-color:var(--vurgu);
     box-shadow:0 0 0 3px var(--vurgu-zemin);background:var(--kart)}
.suzgec{display:flex;gap:4px;padding:0 12px 10px;flex-wrap:wrap}
.suzgec button{flex:1;min-width:58px;padding:5px 6px;
     border:1px solid var(--cizgi);background:var(--kart);
     border-radius:99px;cursor:pointer;font-size:11.5px;color:var(--soluk)}
.suzgec button:hover{background:var(--uzak)}
.suzgec button.aktif{background:var(--vurgu);color:#fff;
     border-color:var(--vurgu);font-weight:600}

.liste{overflow-y:auto;flex:1;border-top:1px solid var(--cizgi);min-height:0}
.satir{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;
     border-bottom:1px solid var(--cizgi2)}
.satir:hover{background:var(--uzak)}
.satir.secili{background:var(--vurgu-zemin);
     box-shadow:inset 3px 0 0 var(--vurgu)}
.satir .ad{flex:1;min-width:0}
.satir .ad b{display:block;font-weight:600;font-size:13px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir.secili .ad b{color:var(--vurgu)}
.satir .ad span{font-size:11px;color:var(--soluk);
     font-variant-numeric:tabular-nums}
.nokta{width:8px;height:8px;border-radius:50%;flex:none}
.nokta.yapilacak{background:var(--kirmizi)}
.nokta.dikkat{background:var(--amber)}
.nokta.bilgi{background:var(--cok-soluk)}
.rozetler{display:flex;gap:3px}
.rozet{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:650;
     font-variant-numeric:tabular-nums}
.rozet.y{background:var(--kirmizi-bg);color:var(--kirmizi);
     box-shadow:inset 0 0 0 1px var(--kirmizi-kenar)}
.rozet.d{background:var(--amber-bg);color:var(--amber);
     box-shadow:inset 0 0 0 1px var(--amber-kenar)}

/* ---- sag panel ---- */
.ana{flex:1;overflow-y:auto;padding:22px 26px 70px;min-width:0}
.bos{color:var(--soluk);padding:60px;text-align:center}
.baslik{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
     margin-bottom:14px}
.baslik h2{font-size:21px;letter-spacing:-.2px}
.baslik .no{color:var(--soluk);font-variant-numeric:tabular-nums;
     font-size:14px}
.etiket{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:650;
     background:var(--gri-bg);color:var(--gri)}
.etiket.bekliyor{background:var(--amber-bg);color:var(--amber)}
.etiket.onayli{background:var(--yesil-bg);color:var(--yesil)}

.kunye{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));
     background:var(--kart);border:1px solid var(--cizgi);
     border-radius:var(--r);overflow:hidden;margin-bottom:18px;
     box-shadow:var(--golge)}
.kunye div{padding:10px 13px;border-right:1px solid var(--cizgi);
     border-bottom:1px solid var(--cizgi)}
.kunye dt{font-size:10.5px;color:var(--soluk);margin:0 0 3px;
     text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kunye dd{margin:0;font-size:17px;font-weight:650;
     font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kunye dd small{font-size:11px;font-weight:400;color:var(--soluk);
     letter-spacing:0}
.kunye dd.uyari{color:var(--kirmizi)}
.kunye dd.iyi{color:var(--yesil)}

/* ---- ogrenci sayfasi sekmeleri ---- */
.sekmeler{display:flex;gap:4px;border-bottom:1px solid var(--cizgi);
     margin:0 0 18px;overflow-x:auto}
.sekmeler button{padding:8px 14px;border:none;background:none;cursor:pointer;
     font-size:13px;font-weight:600;color:var(--soluk);white-space:nowrap;
     border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0}
.sekmeler button:hover{color:var(--metin)}
.sekmeler button.aktif{color:var(--vurgu);border-bottom-color:var(--vurgu)}
.sekmeler .kucuk{font-size:11px;font-weight:600;color:var(--cok-soluk);
     margin-left:5px;font-variant-numeric:tabular-nums}
.sekmeler button.aktif .kucuk{color:var(--vurgu)}

.bolum{margin-bottom:22px}
.bolum > h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;
     color:var(--soluk);margin-bottom:9px;font-weight:700}

/* ---- Ders Alanlar: her ders bir kutu ---- */
.ders-kutu{border:1px solid var(--cizgi);background:var(--kart);
     padding:11px 13px;margin-bottom:10px;border-radius:var(--r);
     box-shadow:var(--golge)}
.ders-kutu h4{font-size:13px;font-weight:650}
.ders-etiket{margin:5px 0 9px;display:flex;gap:6px;flex-wrap:wrap}
.sayac-rozet{font-size:11px;font-weight:600;color:var(--soluk);
     border:1px solid var(--cizgi);border-radius:99px;padding:1px 8px;
     margin-left:4px;white-space:nowrap;background:var(--kart2)}
.tarama{font-size:11px;color:var(--soluk);border:1px solid var(--cizgi);
     border-radius:99px;padding:1px 8px;white-space:nowrap;
     background:var(--kart2)}
.tarama.eski{color:var(--amber);border-color:var(--amber-kenar);
     background:var(--amber-bg)}
.ogrenci-ac{cursor:pointer;text-decoration:underline;
     text-decoration-style:dotted;text-underline-offset:3px}
.ogrenci-ac:hover{color:var(--vurgu)}
.satir-secim{cursor:pointer}
.satir-secim:hover{background:var(--uzak)}

/* ---- uyari kartlari ---- */
.kart{border:1px solid var(--cizgi);border-left-width:3px;
     background:var(--kart);border-radius:var(--r2);padding:11px 13px;
     margin-bottom:8px;box-shadow:var(--golge)}
.kart.yapilacak{border-color:var(--kirmizi-kenar);
     border-left-color:var(--kirmizi);background:var(--kirmizi-bg)}
.kart.dikkat{border-color:var(--amber-kenar);border-left-color:var(--amber);
     background:var(--amber-bg)}
.kart.bilgi{border-left-color:var(--cok-soluk);background:var(--kart)}
.kart.temiz{border-color:var(--yesil-kenar);border-left-color:var(--yesil);
     background:var(--yesil-bg)}
.kart .k-ust{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kart .k-baslik{font-weight:650;font-size:13px}
.kart.yapilacak .k-baslik{color:var(--kirmizi)}
.kart.dikkat .k-baslik{color:var(--amber)}
.kart.temiz .k-baslik{color:var(--yesil)}
.kart .ders{font-size:12px;color:var(--soluk);
     font-variant-numeric:tabular-nums}
.kart .kaynak{margin-left:auto;font-size:10.5px;color:var(--soluk);
     border:1px solid var(--cizgi);padding:1px 6px;border-radius:99px;
     background:var(--kart);white-space:nowrap;font-weight:600}
.kart p{margin:5px 0 0;font-size:13px}

.gerekce{background:var(--kart);border:1px solid var(--cizgi);
     border-radius:var(--r2);padding:11px 13px;font-size:13px;
     margin-bottom:8px;box-shadow:var(--golge)}
.gerekce b{display:block;font-size:11px;color:var(--soluk);font-weight:700;
     text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}

.hesap{background:var(--kart);border:1px solid var(--cizgi);
     border-radius:var(--r);overflow:hidden;max-width:540px;
     box-shadow:var(--golge)}
.hesap div{display:flex;align-items:baseline;gap:10px;padding:8px 13px;
     border-bottom:1px solid var(--cizgi2);font-size:13px}
.hesap div:last-child{border-bottom:none}
.hesap span{flex:1}
.hesap i{font-style:normal;color:var(--soluk);font-size:11px}
.hesap b{font-variant-numeric:tabular-nums;font-size:15px}
.hesap .son{background:var(--kart2);font-weight:650;
     border-top:1px solid var(--cizgi)}
.hesap .son.iyi b{color:var(--yesil)}
.hesap .son.kotu b{color:var(--kirmizi)}

/* ---- tablolar ---- */
.tablo-sar{overflow-x:auto;-webkit-overflow-scrolling:touch;
     border:1px solid var(--cizgi);border-radius:var(--r);
     background:var(--kart);box-shadow:var(--golge)}
table{width:100%;min-width:420px;border-collapse:collapse;
     background:var(--kart);font-size:13px}
.tablo-sar > table{border:none}
th{text-align:left;font-size:10.5px;text-transform:uppercase;
   letter-spacing:.5px;color:var(--soluk);padding:8px 11px;
   background:var(--kart2);border-bottom:1px solid var(--cizgi);
   font-weight:700;position:sticky;top:0;z-index:1}
td{padding:8px 11px;border-bottom:1px solid var(--cizgi2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--kart2)}
td.sayi,th.sayi{text-align:right;font-variant-numeric:tabular-nums}
.kod{font-variant-numeric:tabular-nums;color:var(--soluk);font-size:12px}
.not{display:inline-block;min-width:28px;text-align:center;padding:1px 6px;
   border-radius:var(--r3);font-weight:700;font-size:11.5px;
   background:var(--gri-bg);color:var(--gri)}
.not.kaldi{background:var(--kirmizi-bg);color:var(--kirmizi)}
.not.dc{background:var(--amber-bg);color:var(--amber)}
.not.gecti{background:var(--yesil-bg);color:var(--yesil)}

details{margin-bottom:8px;border:1px solid var(--cizgi);
     border-radius:var(--r2);background:var(--kart);overflow:hidden}
summary{cursor:pointer;font-size:13px;color:var(--vurgu);padding:8px 12px;
     font-weight:600;list-style-position:inside}
summary:hover{background:var(--kart2)}
details[open] summary{border-bottom:1px solid var(--cizgi2)}
details > .tablo-sar,details > table{border:none;border-radius:0;
     box-shadow:none}
details > .kart{margin:8px}
.notlandi{font-size:12px;color:var(--soluk);margin-top:7px}

.ic-arama{display:flex;align-items:center;gap:10px;margin:0 0 14px;
     flex-wrap:wrap}
.ic-arama input{flex:1;max-width:420px;padding:8px 12px;
     border:1px solid var(--cizgi);border-radius:var(--r2);font:inherit;
     background:var(--kart);color:var(--metin)}
.ic-arama input::placeholder{color:var(--cok-soluk)}
.ic-arama input:focus{outline:none;border-color:var(--vurgu);
     box-shadow:0 0 0 3px var(--vurgu-zemin)}
.ic-arama span{font-size:12px;color:var(--soluk)}
.ic-arama .secenek{display:flex;align-items:center;gap:5px;font-size:12px;
     color:var(--soluk);white-space:nowrap;cursor:pointer}

.oneri{margin:7px 0 0;padding:8px 11px;background:var(--kart2);
     border:1px solid var(--cizgi);border-radius:var(--r3);font-size:12.5px}
.oneri b{color:var(--soluk);font-weight:650}
.oneri ul{margin:4px 0 0;padding-left:18px}
.oneri li{margin:2px 0}
.aciklama{font-size:12.5px;color:var(--soluk);line-height:1.65;
     margin:0 0 14px;max-width:74ch}
.uyari-liste{margin:0 0 14px;padding-left:18px;font-size:12.5px;
     color:var(--soluk)}
tr.vurgulu td{background:var(--amber-bg)}
.ok{color:var(--soluk)}
mark{background:var(--isaret);color:var(--isaret-metin);padding:0 2px;
     border-radius:3px}

/* ---- transkript sekmesi ---- */
.tr-ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
     background:var(--kart);border:1px solid var(--cizgi);
     border-radius:var(--r);overflow:hidden;margin-bottom:16px;
     box-shadow:var(--golge)}
.tr-ozet div{padding:9px 12px;border-right:1px solid var(--cizgi);
     border-bottom:1px solid var(--cizgi)}
.tr-ozet dt{font-size:10.5px;color:var(--soluk);text-transform:uppercase;
     letter-spacing:.5px;font-weight:600;margin:0 0 2px}
.tr-ozet dd{margin:0;font-size:16px;font-weight:650;
     font-variant-numeric:tabular-nums}
.tr-ozet dd small{font-size:11px;font-weight:400;color:var(--soluk)}
.tr-donem{margin-bottom:14px;border:1px solid var(--cizgi);
     border-radius:var(--r);background:var(--kart);overflow:hidden;
     box-shadow:var(--golge)}
.tr-donem > h4{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
     padding:9px 13px;background:var(--kart2);
     border-bottom:1px solid var(--cizgi);font-size:12.5px}
.tr-donem > h4 .yil{color:var(--soluk);font-weight:400;font-size:11.5px}
.tr-donem > h4 .saglar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tr-donem table{min-width:560px}
.tr-donem th{position:static}
.tr-gecersiz td{color:var(--cok-soluk)}
.tr-gecersiz td .not{opacity:.65}
.tr-bos{padding:26px;text-align:center;color:var(--soluk);font-size:13px}
.tr-dogrulama{font-size:12px;color:var(--soluk);margin:2px 0 16px;
     display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tik{color:var(--yesil);font-weight:700}
.carpi{color:var(--kirmizi);font-weight:700}

/* ---- dar ekran ---- */
@media (max-width:820px){
  .duzen{display:block;height:auto}
  .yan{width:auto;border-right:none;border-bottom:1px solid var(--cizgi)}
  .liste{max-height:280px}
  .ana{padding:16px 14px 50px}
  .ust{flex-wrap:wrap;gap:8px}
  .ust .sayac{margin-left:0;width:100%}
  .ust .sayac div{flex:1}
  /* Dar ekranda alt yazilarla birlikte gezinme tum ilk ekrani yiyordu;
     yan yana kaydirilabilir seride topluyoruz. */
  .yan > .yan-baslik:first-of-type{display:none}
  .yan-gezinme{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 4px}
  .yonetici-dugme{display:inline-block;width:auto;margin:0;flex:none;
       white-space:nowrap;border:1px solid var(--cizgi);
       background:var(--kart2);border-radius:99px;font-size:12px}
  .yonetici-dugme small{display:none}
}

@media print{
  .yan,.ust .sayac,.sekmeler,.ic-arama{display:none}
  .duzen{height:auto;display:block}
  .ana{overflow:visible;padding:0}
  body{background:#fff;color:#000}
  .kart,.gerekce,.hesap,.tablo-sar,.ders-kutu,.tr-donem{
       box-shadow:none;break-inside:avoid}
  details{border:none}
  details[open] summary{display:none}
  .tr-donem{break-inside:auto}
  thead{display:table-header-group}
}

/* ---- mezuniyet ilerleme cubugu ---- */
.ilerleme{background:var(--kart);border:1px solid var(--cizgi);
     border-radius:var(--r);padding:13px 15px 15px;margin-bottom:18px;
     box-shadow:var(--golge)}
.ilerleme .il-ust{display:flex;align-items:baseline;gap:10px;
     margin-bottom:9px;flex-wrap:wrap}
.ilerleme .il-ust h3{font-size:11px;text-transform:uppercase;
     letter-spacing:.7px;color:var(--soluk);font-weight:700}
.ilerleme .il-ust .buyuk{margin-left:auto;font-size:19px;font-weight:700;
     font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.ilerleme .il-ust .buyuk.kotu{color:var(--kirmizi)}
.ilerleme .il-ust .buyuk.iyi{color:var(--yesil)}
.ilerleme .il-ust .buyuk small{font-size:11px;font-weight:500;
     color:var(--soluk);letter-spacing:0;margin-left:3px}
.ilerleme .pay{font-size:11px;font-weight:700;padding:2px 9px;
     border-radius:99px;letter-spacing:.2px}
.ilerleme .pay.iyi{background:var(--yesil-bg);color:var(--yesil);
     box-shadow:inset 0 0 0 1px var(--yesil-kenar)}
.ilerleme .pay.kotu{background:var(--kirmizi-bg);color:var(--kirmizi);
     box-shadow:inset 0 0 0 1px var(--kirmizi-kenar)}
.cubuk{position:relative;height:26px;border-radius:var(--r3);
     background:var(--uzak);overflow:hidden;display:flex}
.cubuk i{display:block;height:100%;font-style:normal}
.cubuk .c-basarili{background:var(--vurgu)}
.cubuk .c-alt{background:var(--vurgu);opacity:.55}
.cubuk .c-kalan{background:var(--vurgu);opacity:.25}
.cubuk .c-kayip{background:var(--kirmizi);opacity:.65}
.cubuk .esik{position:absolute;top:0;bottom:0;width:2px;
     background:var(--metin);opacity:.55}
/* Esik yazisi cubugun HANGI parcasinin uzerine denk gelecegi onceden
   belli degil; okunabilirligi renge birakmamak icin kendi zemini var. */
.cubuk .esik-yazi{position:absolute;top:4px;font-size:10px;font-weight:700;
     color:var(--metin);white-space:nowrap;padding:1px 5px;margin-left:5px;
     background:var(--kart);border-radius:3px;
     box-shadow:0 0 0 1px var(--cizgi)}
.cubuk .esik-yazi.sol{transform:translateX(-100%);margin-left:-5px}
.ilerleme .anahtar{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;
     font-size:11.5px;color:var(--soluk)}
.ilerleme .anahtar span{display:flex;align-items:center;gap:5px}
.ilerleme .anahtar em{width:9px;height:9px;border-radius:2px;
     font-style:normal;flex:none}

/* ---- yariyil seridi ---- */
.serit{display:flex;gap:4px;margin-top:12px}
.serit .yy{flex:1;min-width:0;border-radius:var(--r3);padding:5px 4px 6px;
     text-align:center;border:1px solid var(--cizgi);background:var(--kart2);
     line-height:1.25;position:relative}
.serit .yy b{display:block;font-size:11px;font-weight:700;
     font-variant-numeric:tabular-nums}
.serit .yy span{display:block;font-size:10px;color:var(--soluk);

.serit .yy.tamam{background:var(--yesil-bg);border-color:var(--yesil-kenar)}
.serit .yy.tamam b{color:var(--yesil)}
.serit .yy.eksik{background:var(--amber-bg);border-color:var(--amber-kenar)}
.serit .yy.eksik b{color:var(--amber)}
.serit .yy.acik{background:var(--kirmizi-bg);border-color:var(--kirmizi-kenar)}
.serit .yy.acik b{color:var(--kirmizi)}
.serit .yy.hedef{box-shadow:0 0 0 2px var(--vurgu)}
.serit .yy.hedef::after{content:"hedef";position:absolute;left:0;right:0;
     bottom:-15px;font-size:9px;font-weight:700;color:var(--vurgu);
     letter-spacing:.4px;text-transform:uppercase}
.serit-sar{margin-bottom:26px}

/* ---- sol listede mini gosterge ---- */
.mini{width:34px;height:4px;border-radius:99px;background:var(--uzak);

.mini .m-var{background:var(--vurgu)}
.mini .m-kayip{background:var(--kirmizi);opacity:.7}

     color:var(--soluk);font-weight:700;margin-bottom:10px}
.sutunlar{display:flex;align-items:stretch;gap:6px;height:104px}
.sutunlar .s{flex:1;display:flex;flex-direction:column;height:100%;
     gap:3px;min-width:0}

   yuzde veriliyordu; sayi ve etiket de ayni kutuyu paylastigi icin
   toplam %100'u asip kutudan tasiyordu. */
.sutunlar .s .cub{flex:1;display:flex;align-items:flex-end;min-height:0}

     font-variant-numeric:tabular-nums}
.sutunlar .s span{font-size:10px;color:var(--soluk);text-align:center;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

     border:1px solid var(--cizgi);border-bottom-width:2px;
     border-radius:4px;padding:0 5px;background:var(--kart2);
     color:var(--soluk)}

<script>
var OGRENCILER = JSON.parse(document.getElementById('veri').textContent);
var KONTENJAN = JSON.parse(document.getElementById('kontenjan').textContent);
var PROGRAM = JSON.parse(document.getElementById('program').textContent);
var KATALOG = JSON.parse(document.getElementById('katalog').textContent);
var AKTSDEGISIM = JSON.parse(document.getElementById('aktsdegisim').textContent);
var suzgec = 'hepsi', arama = '', secilenNo = null;
// Öğrenci sayfasındaki etkin sekme ve Transkript sekmesinin süzgeçleri.
// Öğrenci değişince sekme özete döner (sec), süzgeçler korunur: aynı
// dersi birkaç öğrencide arka arkaya aramak yaygın.
var detaySekme = 'ozet', trArama = '', trGecersiz = false;

function kacar(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(k){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[k];
  });
}
function sayi(v, bos){ return (v === null || v === undefined) ? (bos||'—') : v; }

// Arama icin kucultme. Duz toLocaleLowerCase('tr') YETMIYOR:
//   "İSTATİSTİK" -> "istatistik"   ama  yazilan "Istatistik" -> "ıstatistik"
// Nokta farki yuzunden hicbir sey bulunamiyor. Dort i turevini de ('I',
// 'İ', 'ı', 'i') tek bicime katlayip oyle kucultuyoruz. Degisim birebir
// karakter oldugu icin isaretle()'nin indeksleri kaymaz.
function _kucult(metin){
  return String(metin === null || metin === undefined ? '' : metin)
    .replace(/[İIıi]/g, 'i')
    .toLocaleLowerCase('tr');
}

function gorunur(o){
  if (suzgec === 'yapilacak' && !o.sayim.yapilacak) return false;
  if (suzgec === 'dikkat' && !o.sayim.dikkat) return false;
  if (suzgec === 'temiz' && (o.sayim.yapilacak || o.sayim.dikkat)) return false;
  if (arama){
    var a = _kucult(o.ad + ' ' + o.no);
    if (a.indexOf(arama) === -1) return false;
  }
  return true;
}

function tazelikYaz(){
  var zamanlar = OGRENCILER.map(function(o){ return o.son_tarama; })
                           .filter(Boolean);
  var kutu = document.getElementById('tazelik');
  if (!kutu || !zamanlar.length) return;
  var benzersiz = zamanlar.filter(function(z, i){
    return zamanlar.indexOf(z) === i; });
  if (benzersiz.length < 2) return;
  benzersiz.sort(function(a, b){ return _zamanSayi(a) - _zamanSayi(b); });
  var eskiSay = zamanlar.filter(function(z){
    return z !== benzersiz[benzersiz.length - 1]; }).length;
  kutu.textContent = ' · okumalar ' + benzersiz[0] + ' – '
    + benzersiz[benzersiz.length - 1] + ' arası (' + eskiSay
    + ' öğrenci daha eski)';
}

// Listede herkes ayni gorunuyordu; oysa danismanin ilk merak ettigi
// sey ogrencinin YOLUN NERESINDE oldugu. Mini serit kazanilmis AKTS'yi
// plana orantiliyor, sagdaki kirmizi pay ise plana ulasilamayan kismi.
function miniGosterge(o){
  var p = o.projeksiyon || {};
  var plan = (o.yariyil_serit || []).reduce(function(t, y){
    return t + y.plan; }, 0);
  if (!plan || p.basarili == null) return '';
  var kuyruk = Math.max(0, plan - (p.toplam || plan));
  var kazanilan = Math.min(p.basarili, plan);
  return '<span class="mini" title="' + kazanilan + ' AKTS kazanıldı / '
    + plan + ' AKTS plan'
    + (kuyruk ? ' · ' + kuyruk + ' AKTS plana ulaşılamıyor' : '') + '">'
    + '<i class="m-var" style="width:' + (100 * kazanilan / plan) + '%"></i>'
    + '<i style="flex:1"></i>'
    + (kuyruk ? '<i class="m-kayip" style="width:'
        + (100 * kuyruk / plan) + '%"></i>' : '')
    + '</span>';
}

function listeCiz(){
  var h = '', n = 0;
  OGRENCILER.forEach(function(o){
    if (!gorunur(o)) return;
    n++;
    var rz = '';
    if (o.sayim.yapilacak) rz += '<span class="rozet y">'+o.sayim.yapilacak+'</span>';
    if (o.sayim.dikkat) rz += '<span class="rozet d">'+o.sayim.dikkat+'</span>';
    if (rz) rz = '<span class="rozetler">'+rz+'</span>';
    h += '<div class="satir'+(o.no===secilenNo?' secili':'')+'" data-no="'+o.no+'">'
      +  '<span class="nokta '+o.durum_rengi+'"></span>'
      +  '<span class="ad"><b>'+kacar(o.ad)+'</b><span>'+kacar(o.no)
      +  ' · '+sayi(o.secilen_akts,0)+' AKTS</span>'+miniGosterge(o)
      +  '</span>'+rz+'</div>';
  });
  document.getElementById('liste').innerHTML = h ||
    '<div class="bos" style="padding:30px;font-size:13px">Eşleşen öğrenci yok.</div>';
}

function kartlar(liste, sinif){
  return liste.map(function(u){
    var ders = u.ders_no ? '<span class="ders">'+kacar(u.ders_no)+' · '
      + kacar(u.ders_adi||'')+'</span>' : '';
    var kaynak = u.kaynak ? '<span class="kaynak">'+kacar(u.kaynak)+'</span>' : '';
    return '<div class="kart '+sinif+'"><div class="k-ust">'
      + '<span class="k-baslik">'+kacar(u.baslik)+'</span>'+ders+kaynak
      + '</div><p>'+kacar(u.aciklama)+'</p></div>';
  }).join('');
}

function tablo(basliklar, satirlar){
  if (!satirlar.length) return '';
  return '<div class="tablo-sar"><table><thead><tr>'+basliklar.map(function(b){
      return '<th'+(b.sayi?' class="sayi"':'')+'>'+kacar(b.ad)+'</th>';
    }).join('')+'</tr></thead><tbody>'+satirlar.join('')
    +'</tbody></table></div>';
}

function notSinif(h){
  if (['FF','F','FD','K'].indexOf(h) >= 0) return 'not kaldi';
  if (h === 'DC' || h === 'DD') return 'not dc';
  return 'not';
}

// Kismi tazeleme (--ogrenci) sonrasi satirlar farkli zamanlardan gelir.
// En taze okumayi bulup digerlerini "eski" diye isaretliyoruz ki pano
// basligindaki tek tarih yanlis anlasilmasin.
var _tazeOnbellek = null;
function _enTazeTarama(){
  if (_tazeOnbellek === null){
    _tazeOnbellek = '';
    OGRENCILER.forEach(function(o){
      if (o.son_tarama && _zamanSayi(o.son_tarama) > _zamanSayi(_tazeOnbellek))
        _tazeOnbellek = o.son_tarama;
    });
  }
  return _tazeOnbellek;
}
// "11.09.2026 14:32" -> siralanabilir sayi
function _zamanSayi(m){
  var p = /(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})/.exec(m || '');
  return p ? Number(p[3]+p[2]+p[1]+p[4]+p[5]) : 0;
}

// Hem ogrenci sayfasi hem "Cozulmeli Cakisma" sekmesi kullaniyor.
function oneriKutusu(baslik, dersAdi, liste, zorunluDers){
  if (zorunluDers)
    return '<div class="oneri"><b>'+baslik+'</b> '+kacar(dersAdi)
      + ' zorunlu ders, yerine başka ders konamaz.</div>';
  if (!liste || !liste.length)
    return '<div class="oneri"><b>'+baslik+'</b> '+kacar(dersAdi)
      + ' yerine bu dönem açık uygun ders bulunamadı.</div>';
  var satir = liste.map(function(x){
    var etiket = x.saat_bilinmiyor
      ? '<span class="kod">programda saati yok</span>'
      : (x.catisma.length
         ? '<span class="not dc">'+x.catisma.map(kacar).join(', ')
           + ' ile çakışır</span>'
         : '<span class="not">çakışmasız</span>');
    return '<li>'+kacar(x.ders_adi)+' <span class="kod">'+x.ders_no
      + ' · '+x.akts+' AKTS</span> '+etiket+'</li>';
  }).join('');
  return '<div class="oneri"><b>'+baslik+'</b> '+kacar(dersAdi)
    + ' yerine:<ul>'+satir+'</ul></div>';
}

// Cozulmeli bir cakisma cifti: ne oldugu, neden, hangi ders yerine ne.
function cozulmeliKart(c){
  var ne = c.tip === 'alttan'
    ? 'Alttan ders öncelikli (MADDE 9/1-a); <b>'+kacar(c.b_ad)
      + '</b> bırakılmalı.'
    : (c.tip === 'iki_alttan'
       ? 'İkisi de alttan ders; biri sonraki döneme kalmalı.'
       : 'İkisi de serbest seçim; hangisinin bırakılacağına siz karar verin.');
  var h = '<div class="kart yapilacak">'
    + '<div class="k-ust"><span class="k-baslik">'+kacar(c.a_ad)
    + ' ↔ '+kacar(c.b_ad)+'</span>'
    + '<span class="ders">'+kacar((c.saatler||[]).join(' · '))+'</span>'
    + '<span class="kaynak">MADDE 9/1-b</span></div>'
    + '<p>Her iki derste de devam zorunluluğu var, ikisine birden '
    + 'girilemez. '+ne+'</p>'
    + '<p class="notlandi">'+kacar(c.a_ad)+': '+kacar(c.a_devam_neden)
    + ' &nbsp;|&nbsp; '+kacar(c.b_ad)+': '+kacar(c.b_devam_neden)+'</p>'
    + oneriKutusu('Bırakılırsa', c.b_ad, c.oneriler, c.b_zorunlu_ders);
  if (c.tip === 'secili')
    h += oneriKutusu('Diğer seçenek:', c.a_ad, c.a_oneriler,
                     c.a_zorunlu_ders);
  return h + '</div>';
}

function detayCiz(o){
  var h = '';
  var durumSinif = (o.onay_durumu||'').indexOf('BEKL') >= 0 ? 'bekliyor'
                 : (o.onay_durumu||'').indexOf('ONAY') >= 0 ? 'onayli' : '';

  h += '<div class="baslik"><h2>'+kacar(o.ad)+'</h2>'
    +  '<span class="no">'+kacar(o.no)+'</span>'
    +  (o.onay_durumu ? '<span class="etiket '+durumSinif+'">'
        + kacar(o.onay_durumu)+'</span>' : '')
    +  (o.son_tarama ? '<span class="tarama'
        + (_enTazeTarama() && o.son_tarama !== _enTazeTarama()
           ? ' eski' : '')
        + '">OBIS okumasi: '+kacar(o.son_tarama)+'</span>' : '')
    +  '<button type="button" class="kopyala" id="kopyala">'
        + 'Özeti kopyala</button>'
    +  '</div>';

  // --- künye ---
  var p0 = o.projeksiyon || {};
  var limitMetni = o.akts_limiti === null
      ? 'sınırsız <small>son sınıf</small>'
      : sayi(o.akts_limiti) + ' <small>AKTS</small>';
  var asim = (o.akts_limiti !== null && o.secilen_akts > o.akts_limiti);
  h += '<dl class="kunye">'
    + '<div><dt>GANO</dt><dd>'+sayi(o.gano)+'</dd></div>'
    + '<div><dt>Sınıf</dt><dd>'+sayi(o.sinif)+'. <small>hedef '
      + sayi(o.hedef_donem)+'. dönem</small></dd></div>'
    + '<div><dt>AKTS limiti</dt><dd>'+limitMetni+'</dd></div>'
    + '<div><dt>Seçilen</dt><dd class="'+(asim?'uyari':'')+'">'
      + sayi(o.secilen_akts,0)+' <small>AKTS · '+sayi(o.secilen_ders_sayisi,0)
      + ' ders</small></dd></div>'
    + '<div><dt>Alttan</dt><dd class="'+(o.kalinan_sayisi?'uyari':'iyi')+'">'
      + o.kalinan_sayisi+' <small>ders · '+o.kalinan_akts+' AKTS</small></dd></div>'
    + '<div><dt>Mezuniyet AKTS</dt><dd class="'
      + ((p0.yeterli === false)?'uyari':((p0.toplam!=null)?'iyi':''))+'">'
      + sayi(p0.toplam, sayi(o.beklenen_mezuniyet_akts))
      + ' <small>asgari '+sayi(p0.asgari,240)+'</small></dd></div>'
    + '</dl>';

  h += ilerlemeCubugu(o);
  h += yariyilSeridi(o);
  h += sekmeCubugu(o);
  h += '<div id="detay-govde">'
    + (detaySekme === 'transkript' ? transkriptGovde(o) : ozetGovde(o))
    + '</div>';
  document.getElementById('ana').innerHTML = h;
}

// Mezuniyet AKTS'si bes parcadan olusuyor ve danisman bunlari bugune
// kadar tablodan okuyordu. Cubuk ayni sayilari ORANTIYLA gosteriyor:
// asgari cizgisinin solunda mi sagda mi kaldigi tek bakista belli.
function ilerlemeCubugu(o){
  var p = o.projeksiyon || {};
  if (p.toplam == null) return '';
  var asgari = p.asgari || 240;
  var plan = (o.yariyil_serit || []).reduce(function(t, y){
    return t + y.plan; }, 0) || asgari;
  // Olcek plandan kucuk olamaz; fazladan ders alip plani asan
  // ogrencinin cubugu da tasmamali.
  var olcek = Math.max(plan, p.toplam, asgari);
  function yuzde(v){ return (100 * (v || 0) / olcek) + '%'; }

  // Mavi parcalarin toplami PROJEKSIYONA esit olmali. Kayip ayri bir
  // parca olarak eklenirse cubuk olcegi asar ve sessizce kirpilir;
  // "ulasilamayan" anahtarda yazip cubukta gorunmez olurdu.
  var b1 = Math.min(p.basarili || 0, p.toplam);
  var b2 = Math.min(p.alt_yukumluluk || 0, p.toplam - b1);
  var b3 = Math.max(0, p.toplam - b1 - b2);
  var kuyruk = Math.max(0, olcek - p.toplam);   // plana ulasilamayan pay

  var fark = p.fark;
  var payMetni = (fark == null) ? ''
    : (fark >= 0 ? fark + ' AKTS pay' : (-fark) + ' AKTS eksik');

  var h = '<div class="ilerleme"><div class="il-ust">'
    + '<h3>Mezuniyet ilerlemesi</h3>'
    + (payMetni ? '<span class="pay ' + (fark >= 0 ? 'iyi' : 'kotu') + '">'
        + payMetni + '</span>' : '')
    + '<span class="buyuk ' + (p.yeterli === false ? 'kotu' : 'iyi') + '">'
    + p.toplam + '<small>/ ' + asgari + ' AKTS</small></span></div>';

  // Esik cizgisinin yazisi sag kenara yakinsa cizginin SOLUNA yazilir,
  // yoksa cubuktan tasip gorunmez oluyor.
  var esikOran = asgari / olcek;
  h += '<div class="cubuk">'
    + '<i class="c-basarili" style="width:' + yuzde(b1)
    + '" title="Basarili olduğu dersler: ' + b1 + ' AKTS"></i>'
    + '<i class="c-alt" style="width:' + yuzde(b2)
    + '" title="Kalan yukumluluk: ' + b2 + ' AKTS"></i>'
    + '<i class="c-kalan" style="width:' + yuzde(b3)
    + '" title="Girilmemis donemler: ' + b3 + ' AKTS"></i>'
    + (kuyruk ? '<i class="c-kayip" style="width:' + yuzde(kuyruk)
        + '" title="Plana ulasilamayan: ' + kuyruk + ' AKTS"></i>' : '')
    + '<span class="esik" style="left:' + yuzde(asgari) + '"></span>'
    + '<span class="esik-yazi' + (esikOran > 0.6 ? ' sol' : '')
    + '" style="left:' + yuzde(asgari) + '">asgari ' + asgari + '</span>'
    + '</div>';

  h += '<div class="anahtar">'
    + '<span><em style="background:var(--vurgu)"></em>başarılı '
      + (p.basarili || 0) + '</span>'
    + (p.alt_yukumluluk ? '<span><em style="background:var(--vurgu);'
        + 'opacity:.55"></em>kalan yükümlülük ' + p.alt_yukumluluk
        + '</span>' : '')
    + (p.kalan_akts ? '<span><em style="background:var(--vurgu);'
        + 'opacity:.25"></em>girilmemiş dönemler ' + p.kalan_akts
        + '</span>' : '')
    + (kuyruk ? '<span><em style="background:var(--kirmizi);opacity:.65">'
        + '</em>plana ulaşılamayan ' + kuyruk + '</span>' : '')
    + '</div></div>';
  return h;
}

function yariyilSeridi(o){
  var serit = o.yariyil_serit || [];
  if (!serit.length) return '';
  var ad = {tamam:'tamamlandı', eksik:'eksik', acik:'kapanmayan açık',
            bos:'henüz girilmedi'};
  var h = '<div class="serit-sar"><div class="bolum" style="margin:0">'
    + '<h3>Yarıyıl yarıyıl</h3><div class="serit">';
  serit.forEach(function(y){
    var ek = y.kalici ? ' · ' + y.kalici + ' AKTS kapanmıyor' : '';
    h += '<div class="yy ' + y.durum + (y.hedef ? ' hedef' : '')
      + '" title="' + y.yariyil + '. yarıyıl: ' + ad[y.durum] + ' — '
      + y.gecilen + '/' + y.plan + ' AKTS' + ek + '">'
      + '<b>' + y.yariyil + '</b><span>' + y.gecilen + '/' + y.plan
      + '</span></div>';
  });
  return h + '</div></div></div>';
}

function sekmeCubugu(o){
  var n = (o.uyarilar||[]).filter(function(u){
    return u.onem !== 'bilgi'; }).length;
  var t = o.transkript;
  function dugme(anahtar, ad, sayac){
    var etkin = detaySekme === anahtar;
    return '<button type="button" role="tab" data-sekme="'+anahtar
      + '" aria-selected="'+(etkin ? 'true' : 'false')+'" class="'
      + (etkin ? 'aktif' : '')+'">'+ad
      + (sayac ? '<span class="kucuk">'+sayac+'</span>' : '')+'</button>';
  }
  return '<div class="sekmeler" role="tablist">'
    + dugme('ozet', 'Danışman özeti', n)
    + (t ? dugme('transkript', 'Transkript', t.deneme_sayisi) : '')
    + '</div>';
}

function acikGerekce(o){
  // Düşülen AKTS nereden geliyor? Yarıyıl yarıyıl söylemek, tek bir
  // "müfredat düşüşü" ibaresinden çok daha kullanışlı: danışman hangi
  // yarıyılı konuşacağını biliyor.
  var a = o.kohort_acigi;
  if (!a) return (o.projeksiyon||{}).kayip_kaynagi || 'müfredat düşüşü';
  return a.kalemler.map(function(k){
    return k.yariyil + '. yarıyıl ' + k.kalici; }).join(' + ') + ' AKTS';
}

function ozetGovde(o){
  var h = '';
  var grup = {yapilacak:[], dikkat:[], bilgi:[]};
  o.uyarilar.forEach(function(u){ grup[u.onem].push(u); });

  // --- son sınıf gerekçesi ---
  if (o.son_sinif_sebep){
    h += '<div class="gerekce"><b>AKTS limiti nasıl belirlendi</b>'
      + kacar(o.son_sinif_sebep)
      + (o.ust_donem_sebep ? ' ' + kacar(o.ust_donem_sebep) : '')
      + '</div>';
  }

  if (grup.yapilacak.length)
    h += '<div class="bolum"><h3>Yapılması gerekenler ('
      + grup.yapilacak.length+')</h3>'+kartlar(grup.yapilacak,'yapilacak')+'</div>';
  if (grup.dikkat.length)
    h += '<div class="bolum"><h3>Dikkat edilmesi gerekenler ('
      + grup.dikkat.length+')</h3>'+kartlar(grup.dikkat,'dikkat')+'</div>';
  if (!grup.yapilacak.length && !grup.dikkat.length)
    h += '<div class="bolum"><div class="kart temiz"><div class="k-ust">'
      + '<span class="k-baslik">Sorun görünmüyor</span></div>'
      + '<p>Kuralların hiçbiri bu öğrenci için uyarı üretmedi. Yine de '
      + 'seçilen dersleri gözden geçirin.</p></div></div>';

  // --- mezuniyet AKTS hesabı ---
  var p = o.projeksiyon || {};
  if (p.toplam != null){
    var donemMetni = (p.kalan_donemler||[]).join('. ve ') + '. dönem';
    var girMetni = (p.girilen_donemler||[]).join(', ') + '. dönem';
    h += '<div class="bolum"><h3>Mezuniyet AKTS hesabı</h3>'
      + '<div class="hesap">'
      + '<div><span>Başarılı olduğu dersler</span><b>'+p.basarili+'</b></div>'
      + '<div><span>+ Kalan yükümlülük <i>'+girMetni+' içinden</i></span><b>'
        + p.alt_yukumluluk+'</b></div>'
      + '<div><span>+ Girilmemiş dönemler <i>'+donemMetni+'</i></span><b>'
        + p.kalan_akts+'</b></div>'
      + (p.kayip ? '<div><span>− Plana ulaşılamayan AKTS <i>'
        + kacar(acikGerekce(o))+'</i></span><b>'+p.kayip+'</b></div>' : '')
      + '<div class="son '+(p.yeterli===false?'kotu':'iyi')+'">'
        + '<span>Mezuniyet toplamı</span><b>'+p.toplam+' AKTS</b></div>'
      + '</div>'
      + '<div class="notlandi">Yönetmelik asgarisi '+p.asgari+' AKTS · '
        + (p.fark >= 0 ? p.fark+' AKTS pay var' : (-p.fark)+' AKTS EKSİK')
      + '</div></div>';
  }

  // --- bu dönemin kompozisyonu ---
  var km = o.kompozisyon;
  if (km){
    h += '<div class="bolum"><h3>'+km.donem+'. dönem ders kompozisyonu</h3>'
      + tablo([{ad:'Kova'},{ad:'Seçilen',sayi:1},{ad:'Gereken',sayi:1},
               {ad:'Eksik'}],
        km.satirlar.map(function(s){
          var tam = s.var >= s.gerek && !s.eksik.length;
          return '<tr><td>'+kacar(s.ad)+'</td><td class="sayi">'+s.var
            + '</td><td class="sayi">'+s.gerek+'</td><td>'
            + (tam ? '<span class="kod">tamam</span>'
                   : '<span class="not kaldi">'+kacar(s.eksik.join(', '))
                     +'</span>')+'</td></tr>';
        }))
      + '<div class="notlandi">Toplam '+km.secilen+' / '+km.toplam+' AKTS'
      + (km.eksik ? ' — <b style="display:inline">'+km.eksik
                    +' AKTS eksik</b>' : ' — tamam')
      + '</div></div>';
  }

  // --- çakışmalar ---
  // İki ayrı bölüm: devam zorunluluğu olan çakışmalar DEĞİŞTİRİLMELİ,
  // en az bir tarafta devam şartı sağlanmışsa yalnızca bildirilir.
  var cakZor = (o.cakismalar||[]).filter(function(c){ return c.cozulmeli; });
  var cakHak = (o.cakismalar||[]).filter(function(c){ return c.hak_ici; });
  var cakSer = (o.cakismalar||[]).filter(function(c){
    return !c.cozulmeli && !c.hak_ici; });

  if (cakZor.length){
    h += '<div class="bolum"><h3>Çakışma — DEĞİŞTİRİLMELİ ('
      + cakZor.length+')</h3>';
    cakZor.forEach(function(c){ h += cozulmeliKart(c); });
    h += '</div>';
  }

  if (cakHak.length){
    h += '<div class="bolum"><h3>Çakışma — devamsızlık hakkına sığıyor ('
      + cakHak.length+')</h3>'
      + '<p class="aciklama">Çakışan saatler iki dersin devamsızlık '
      + 'hakkının (teorikte %30, uygulamada %20 — MADDE 10/1) içinde '
      + 'kalıyor: öğrenci çakışan saatte derslerden birine girer, '
      + 'kaçırdığı saatler haktan düşer. <b>İkisi birlikte alınabilir.</b> '
      + 'Ancak hakkın büyük kısmı programa harcanmış olur; hastalık ya da '
      + 'mazeret için pay kalmaz. Çakışmasız bir alternatif varsa onu '
      + 'tercih etmek daha güvenli.</p>';
    cakHak.forEach(function(c){
      var d = c.devamsizlik || {};
      var temiz = ((c.oneriler||[]).concat(c.a_oneriler||[]))
        .filter(function(x){ return !x.catisma.length; });
      h += '<div class="kart dikkat">'
        + '<div class="k-ust"><span class="k-baslik">'+kacar(c.a_ad)
        + ' ↔ '+kacar(c.b_ad)+'</span>'
        + '<span class="ders">'+kacar(c.saatler.join(' · '))+'</span>'
        + '<span class="kaynak">MADDE 10/1</span></div>'
        + '<p>'+kacar(c.a_ad)+' haftada '+d.a_saat+' saat (hak '+d.a_hak
        + ' sa), '+kacar(c.b_ad)+' '+d.b_saat+' saat (hak '+d.b_hak
        + ' sa). Çakışan '+d.ortak_saat+' saat ikisinin hakkına sığıyor, '
        + 'geriye '+d.kalan_pay+' saatlik pay kalır.'
        + (d.tek_derse_yigilabilir
           ? ' Kayıp tek derse yığılabilir: birine tam devam edip diğerinde '
             + 'hak sınırında kalmak mümkün.'
           : ' Kayıp iki derse BÖLÜŞTÜRÜLMELİ; tek derse yığılamaz.')
        + '</p>';
      if (temiz.length)
        h += '<div class="oneri"><b>Hak harcamadan çözülebilir:</b> '
          + temiz.map(function(x){
              return kacar(x.ders_adi)+' <span class="kod">'+x.ders_no
                + ' · '+x.akts+' AKTS</span>'; }).join(', ')
          + ' çakışmasız.</div>';
      h += '</div>';
    });
    h += '</div>';
  }

  if (cakSer.length){
    h += '<div class="bolum"><h3>Çakışma var — devam zorunluluğu yok ('
      + cakSer.length+')</h3>'
      + '<p class="aciklama">Aşağıdaki derslerde en az bir tarafta devam '
      + 'şartı daha önce sağlanmış (MADDE 10/2), öğrenci o derse girmek '
      + 'zorunda değil. <b>Değiştirilmesi zorunlu değil</b> — bilginize. '
      + 'Sınav saatleri çakışırsa ayrıca bakılmalı.</p>'
      + tablo([{ad:'Ders'},{ad:'Çakıştığı'},{ad:'Saat'},
               {ad:'Devam durumu'}],
      cakSer.map(function(c){
        var muaf = [];
        if (!c.a_devam) muaf.push(kacar(c.a_ad)+': '+kacar(c.a_devam_neden));
        if (!c.b_devam) muaf.push(kacar(c.b_ad)+': '+kacar(c.b_devam_neden));
        return '<tr><td>'+kacar(c.a_ad)
          + (c.tip!=='secili' ? ' <span class="not kaldi">alttan</span>' : '')
          + '</td><td>'+kacar(c.b_ad)
          + (c.b_secili ? ' <span class="kod">seçili</span>' : '')
          + '</td><td class="kod">'+kacar(c.saatler.join(', '))
          + '</td><td class="kod">'+muaf.join('<br>')+'</td></tr>';
      }))+'</div>';
  }

  // --- seçilen dersler ---
  if (o.secilen_dersler.length){
    h += '<div class="bolum"><h3>Seçilen dersler</h3>'+tablo(
      [{ad:'Kod'},{ad:'Ders'},{ad:'AKTS',sayi:1},{ad:'Açıklama'}],
      o.secilen_dersler.map(function(d){
        return '<tr><td class="kod">'+kacar(d.ders_no)+'</td><td>'
          + kacar(d.ders_adi)+'</td><td class="sayi">'+sayi(d.akts,'')
          + '</td><td>'+kacar(d.aciklama||'')+'</td></tr>';
      }))+'</div>';
  }

  // --- alttan dersler ---
  if (o.alttan.length){
    h += '<div class="bolum"><h3>Alttan dersler (bu dönem açık)</h3>'+tablo(
      [{ad:'Kod'},{ad:'Ders'},{ad:'AKTS',sayi:1},{ad:'Eski not'},{ad:'Durum'}],
      o.alttan.map(function(d){
        return '<tr><td class="kod">'+kacar(d.ders_no)+'</td><td>'
          + kacar(d.ders_adi)+'</td><td class="sayi">'+sayi(d.akts,'')
          + '</td><td><span class="'+notSinif(d.harf)+'">'+kacar(d.harf)
          + '</span> <span class="kod">'+sayi(d.yil,'')+'</span></td><td>'
          + kacar(d.durum)+'</td></tr>';
      }))+'</div>';
  }

  // --- transkript ---
  h += '<div class="bolum"><h3>Transkript</h3>'
    + '<div class="gerekce">Geçilen <b style="display:inline">'
    + o.gecilen_sayisi+'</b> ders / '+o.gecilen_akts+' AKTS'
    + ' · Toplam '+o.deneme_sayisi+' deneme'
    + (o.son_basarisizlik_yili ? ' · Son başarısızlık '+o.son_basarisizlik_yili : '')
    + '</div>';
  if (o.tekrar_edilen.length){
    h += '<details><summary>Birden çok kez alınan dersler ('
      + o.tekrar_edilen.length+')</summary>'+tablo(
      [{ad:'Kod'},{ad:'Ders'},{ad:'Geçmiş'},{ad:'Güncel'}],
      o.tekrar_edilen.map(function(d){
        return '<tr><td class="kod">'+kacar(d.ders_kodu)+'</td><td>'
          + kacar(d.ders_adi)+'</td><td class="kod">'+kacar(d.gecmis)
          + '</td><td><span class="'+notSinif(d.guncel_harf)+'">'
          + kacar(d.guncel_harf)+'</span></td></tr>';
      }))+'</details>';
  }
  if (o.dc_dersler.length){
    var dcSay = o.dc_dersler.filter(function(d){return !d.sayiliyor;}).length;
    h += '<details><summary>Şartlı geçer (DC) dersler ('+o.dc_dersler.length
      + (dcSay ? ', '+dcSay+' tanesi sayılmıyor' : '')
      + ')</summary>'+tablo([{ad:'Kod'},{ad:'Ders'},{ad:'AKTS',sayi:1},{ad:'Yıl'},{ad:'Durum'}],
      o.dc_dersler.map(function(d){
        return '<tr><td class="kod">'+kacar(d.ders_kodu)+'</td><td>'
          + kacar(d.ders_adi)+'</td><td class="sayi">'+d.akts
          + '</td><td class="kod">'+sayi(d.yil,'')+'</td><td>'
          + (d.sayiliyor ? '<span class="not">sayıldı</span>'
                         : '<span class="not kaldi">OBİS saymıyor</span>')
          + '</td></tr>';
      }))+'</details>';
  }
  if (grup.bilgi.length)
    h += '<details><summary>Bilgi notları ('+grup.bilgi.length+')</summary>'
      + kartlar(grup.bilgi,'bilgi')+'</details>';
  h += '<div class="notlandi">Bu özet salt okuma ile üretildi; hiçbir ders '
    + 'eklenmedi, çıkarılmadı, kaydedilmedi veya onaylanmadı.</div></div>';
  return h;
}

/* ===================================================================
   Transkript sekmesi
   =================================================================== */
function transkriptGovde(o){
  var t = o.transkript;
  if (!t) return '<div class="tr-bos">Bu öğrencinin transkripti '
    + 'okunamadı.</div>';

  var h = '<dl class="tr-ozet">'
    + '<div><dt>GANO</dt><dd>'+sayi(t.gno)+'</dd></div>'
    + '<div><dt>Toplam AKTS</dt><dd>'+sayi(t.toplam_akts)+'</dd></div>'
    + '<div><dt>Son dönem ort.</dt><dd>'+sayi(t.son_donem_ort)+'</dd></div>'
    + '<div><dt>Son dönem AKTS</dt><dd>'+sayi(t.son_donem_akts)
      + '</dd></div>'
    + '<div><dt>Kayıt</dt><dd>'+t.deneme_sayisi
      + ' <small>'+t.gecersiz_sayisi+' geçersiz</small></dd></div>'
    + '</dl>';

  // OBİS'in yazdığı toplam AKTS ve GANO, transkriptten yeniden
  // hesapladığımızla tutuyor mu? Tutmuyorsa ayrıştırma kaymış
  // demektir ve buradaki her sayı şüphelidir - danışman görmeli.
  function im(deger, ad){
    if (deger === null || deger === undefined)
      return '<span class="ok">'+ad+' denetlenemedi</span>';
    return deger ? '<span><span class="tik">✓</span> '+ad+' tutuyor</span>'
                 : '<span><span class="carpi">✗</span> '+ad
                   + ' TUTMUYOR</span>';
  }
  h += '<div class="tr-dogrulama">'+im(t.akts_dogru, 'Toplam AKTS')
    + im(t.gano_dogru, 'GANO')+'</div>';

  h += '<div class="ic-arama">'
    + '<input id="tr-ara" placeholder="Ders adı veya kodu ara…" value="'
      + kacar(trArama)+'">'
    + '<label class="secenek"><input type="checkbox" id="tr-gecersiz"'
      + (trGecersiz ? ' checked' : '')
      + '> geçersiz denemeleri de göster</label>'
    + '<span id="tr-sayac">'+trSayacMetni(o)+'</span></div>';
  h += '<div id="tr-liste">'+trListe(o)+'</div>';
  return h;
}

function trSuzulmus(g){
  // Geçersiz deneme = ders sonradan tekrar alınmış, bu satır artık
  // sayılmıyor. Varsayılan olarak gizli: aksi halde bir ders üç kez
  // görünüp danışmanı yanıltıyor.
  var ara = _kucult(trArama);
  return g.dersler.filter(function(d){
    if (!trGecersiz && d.gecersiz) return false;
    if (!ara) return true;
    return _kucult((d.ad||'') + ' ' + (d.kod||'')).indexOf(ara) >= 0;
  });
}

function trSayacMetni(o){
  var t = o.transkript, toplam = 0, gosterilen = 0;
  (t.donemler||[]).forEach(function(g){
    toplam += g.dersler.length;
    gosterilen += trSuzulmus(g).length;
  });
  return gosterilen === toplam ? (toplam + ' kayıt')
       : (gosterilen + ' / ' + toplam + ' kayıt');
}

function trListe(o){
  var t = o.transkript, h = '';
  (t.donemler||[]).forEach(function(g){
    var dersler = trSuzulmus(g);
    if (!dersler.length) return;
    h += '<div class="tr-donem"><h4>'
      + (g.donem ? g.donem + '. dönem' : 'Dönemi belirsiz')
      + (g.yillar ? '<span class="yil">'+kacar(g.yillar)+'</span>' : '')
      + '<span class="saglar">'
      + '<span class="sayac-rozet">'+g.ders_sayisi+' kayıt</span>'
      + '<span class="sayac-rozet">geçilen '+g.gecilen_akts
        + ' AKTS</span></span></h4>'
      + tablo([{ad:'Kod'},{ad:'Ders'},{ad:'AKTS',sayi:1},{ad:'Yıl',sayi:1},
               {ad:'Vize 1',sayi:1},{ad:'Vize 2',sayi:1},
               {ad:'Final',sayi:1},{ad:'Büt.',sayi:1},{ad:'Harf'}],
        dersler.map(function(d){
          var ara = _kucult(trArama);
          return '<tr class="tr-satir'+(d.gecersiz ? ' tr-gecersiz' : '')+'">'
            + '<td class="kod">'+isaretle(d.kod||'', ara)+'</td>'
            + '<td>'+isaretle(d.ad||'', ara)
              + (d.gecersiz ? ' <span class="kod">geçersiz — sonradan '
                 + 'tekrar alınmış</span>' : '')
              + (d.eski ? ' <span class="kod">eski sistem</span>' : '')
            + '</td>'
            + '<td class="sayi">'+sayi(d.akts,'')+'</td>'
            + '<td class="sayi kod">'+sayi(d.yil,'')+'</td>'
            + '<td class="sayi">'+kacar(d.v1)+'</td>'
            + '<td class="sayi">'+kacar(d.v2)+'</td>'
            + '<td class="sayi">'+kacar(d.fin)+'</td>'
            + '<td class="sayi">'+kacar(d.but)+'</td>'
            + '<td><span class="'+trNotSinif(d)+'">'+kacar(d.harf)
              + '</span></td></tr>';
        }))
      + '</div>';
  });
  return h || '<div class="tr-bos">Eşleşen ders yok.</div>';
}

function trNotSinif(d){
  // Harfin kendisi yetmiyor: DC yarıyıl ortalamasına göre geçer ya da
  // kalır (MADDE 15/1). Ayrıştırıcının verdiği sonuç doğru cevap.
  if (d.sonuc === 'gecti' || d.sonuc === 'muaf' || d.sonuc === 'kredisiz_gecti') return 'not gecti';
  if (d.sonuc === 'kaldi') return 'not kaldi';
  if (d.sonuc === 'sartli_kaldi') return 'not dc';
  return notSinif(d.harf);
}

function trListeYaz(){
  var o = OGRENCILER.filter(function(x){ return x.no === secilenNo; })[0];
  if (!o || !o.transkript) return;
  // Sekme degismis olabilir: eleman yoksa sessizce cik. Atmaya
  // birakirsak sayfanin geri kalani da olulur.
  var liste = document.getElementById('tr-liste');
  var sayac = document.getElementById('tr-sayac');
  if (!liste) return;

}

// Yonetici ozeti bugune kadar yalniz kontenjan tablosuydu. Danismanin
// "grubum genel olarak nerede?" sorusuna cevap veren hicbir sey yoktu.
// Uc dagilim: durum, mezuniyet projeksiyonu ve giris yili.
function dagilimKutusu(baslik, dilimler){
  var enBuyuk = dilimler.reduce(function(m, d){
    return Math.max(m, d.n); }, 0) || 1;
  var h = '<div class="kutu"><h4>' + kacar(baslik) + '</h4>'
    + '<div class="sutunlar">';
  dilimler.forEach(function(d){
    h += '<div class="s ' + (d.sinif || '') + '" title="'
      + kacar(d.ad) + ': ' + d.n + ' öğrenci">'
      + '<b>' + d.n + '</b>'
      + '<div class="cub"><i style="height:'
      + Math.max(2, 100 * d.n / enBuyuk) + '%"></i></div>'
      + '<span>' + kacar(d.kisa || d.ad) + '</span></div>';
  });
  return h + '</div></div>';
}

function dagilimlar(){
  var yap = 0, dik = 0, tem = 0;
  OGRENCILER.forEach(function(o){
    if (o.sayim.yapilacak) yap++;
    else if (o.sayim.dikkat) dik++;
    else tem++;
  });

  // Mezuniyet projeksiyonu: asgariye gore nerede duruyorlar?
  var kova = {eksik:0, sinirda:0, rahat:0, bilinmiyor:0};
  OGRENCILER.forEach(function(o){
    var f = (o.projeksiyon || {}).fark;
    if (f == null) kova.bilinmiyor++;
    else if (f < 0) kova.eksik++;
    else if (f < 5) kova.sinirda++;
    else kova.rahat++;
  });

  // Giris yili ogrenci numarasinin ilk iki hanesinden geliyor.
  var yillar = {};
  OGRENCILER.forEach(function(o){
    var no = String(o.no || '');
    var y = no.length >= 2 ? '20' + no.slice(0, 2) : '?';
    yillar[y] = (yillar[y] || 0) + 1;
  });
  var yilListesi = Object.keys(yillar).sort().map(function(y){
    return {ad: y + ' girişli', kisa: y, n: yillar[y]}; });

  var h = '<div class="dagilim">';
  h += dagilimKutusu('Durum', [
    {ad: 'Yapılacak işi olan', kisa: 'yapılacak', n: yap, sinif: 'y'},
    {ad: 'Dikkat edilecek', kisa: 'dikkat', n: dik, sinif: 'd'},
    {ad: 'Uyarı üretmeyen', kisa: 'temiz', n: tem, sinif: 't'}]);
  h += dagilimKutusu('Mezuniyet projeksiyonu', [
    {ad: 'Asgarinin altında', kisa: 'eksik', n: kova.eksik, sinif: 'y'},
    {ad: 'Payı 5 AKTS altı', kisa: 'sınırda', n: kova.sinirda, sinif: 'd'},
    {ad: 'Payı 5 AKTS ve üstü', kisa: 'rahat', n: kova.rahat, sinif: 't'},
    {ad: 'Hesaplanamadı', kisa: 'bilinmiyor', n: kova.bilinmiyor}]
    .filter(function(d){ return d.n; }));
  if (yilListesi.length > 1)
    h += dagilimKutusu('Giriş yılı', yilListesi);
  return h + '</div>';
}

}

function cakismaGovde(dizin, tumAdlar){
  var p = PROGRAM || {};
  var ara = _kucult(cakismaArama).trim();

  // Arama hem ders adında hem çakıştığı derslerde hem saatlerde geçer.
  var adlar = tumAdlar.filter(function(a){
    if (!ara) return true;
    if (_kucult(a).indexOf(ara) >= 0) return true;
    if (((p.dersler[a]||{}).saatler||[]).join(' ')
        .indexOf(ara) >= 0) return true;
    return dizin[a].some(function(x){
      return _kucult(x[0]).indexOf(ara) >= 0; });
  });

  document.getElementById('cakisma-sayac').textContent =
    ara ? (adlar.length + ' / ' + tumAdlar.length + ' ders') : '';

  var govde = document.getElementById('cakisma-govde');
  if (!adlar.length){
    govde.innerHTML = '<div class="bos" style="padding:30px;font-size:13px">'
      + 'Eşleşen ders yok.</div>';
    return;
  }

  govde.innerHTML = tablo(
    [{ad:'Bu ders alınırsa'},{ad:'Sayı',sayi:1},{ad:'Bunlar alınamaz'}],
    adlar.map(function(a){
      var d = p.dersler[a] || {};
      var liste = dizin[a].slice().sort(function(x,y){
        return x[0].localeCompare(y[0],'tr'); });
      return '<tr><td><b>'+isaretle(a, ara)+'</b><br><span class="kod">'
        + isaretle((d.saatler||[]).join(' · '), ara)+'</span></td>'
        + '<td class="sayi">'+liste.length+'</td><td>'
        + liste.map(function(x){
            return '<div>'+isaretle(x[0], ara)+' <span class="kod">'
              + kacar(x[1].join(', '))+'</span></div>'; }).join('')
        + '</td></tr>';
    }));
}

function isaretle(metin, ara){
  var g = kacar(metin);
  if (!ara) return g;
  var alt = _kucult(g), i = alt.indexOf(ara), sonuc = '', k = 0;
  while (i >= 0){
    sonuc += g.slice(k, i) + '<mark>' + g.slice(i, i+ara.length) + '</mark>';
    k = i + ara.length;
    i = alt.indexOf(ara, k);
  }
  return sonuc + g.slice(k);
}

  var ara = _kucult(derslerArama).trim();
  var h = '', gorunen = 0, tumu = 0;

  Object.keys(k).sort(function(a,b){ return a-b; }).forEach(function(d){
    var satirlar = [];
    k[d].forEach(function(c){
      tumu++;
      var pa = c.program_adi;
      var saatler = pa && p.dersler[pa] ? p.dersler[pa].saatler : [];
      var cak = pa && dizin[pa] ? dizin[pa].length : 0;
      var metin = [c.ders_no, c.ders_adi, saatler.join(' '), c.tip]
                  .join(' ');
      metin = _kucult(metin);
      if (ara && metin.indexOf(ara) < 0) return;
      gorunen++;
      var tipEtiket = c.tip === 'TOS' ? '<span class="not dc">TOS</span>'
        : (c.tip === 'Seçmeli' ? '<span class="kod">seçmeli</span>'

                          : '<span class="kod">açık</span>')+'</td>'
        + '<td class="kod">'+(saatler.length
            ? isaretle(saatler.join(' · '), ara)
            : '<i>programda saat yok</i>')+'</td>'
        + '<td class="sayi">'+(cak || '—')+'</td></tr>');
    });
    if (!satirlar.length) return;
    h += '<div class="bolum"><h3>'+d+'. dönem ('+satirlar.length
      + ' ders)</h3>'+tablo(
      [{ad:'Kod'},{ad:'Ders'},{ad:'AKTS',sayi:1},{ad:'Tip'},{ad:'Kontenjan'},
       {ad:'Saat'},{ad:'Çakışma',sayi:1}], satirlar)+'</div>';
  });

  document.getElementById('dersler-sayac').textContent =
    ara ? (gorunen + ' / ' + tumu + ' ders') : '';
  document.getElementById('dersler-govde').innerHTML = h ||
    '<div class="bos" style="padding:30px;font-size:13px">'
    + 'Eşleşen ders yok.</div>';
}

// --- Ders Alanlar -------------------------------------------------
// "Hangi dersi hangi ogrenci almis?" Veri zaten her ogrencinin
// secilen_dersler listesinde; burada tersine ceviriyoruz: ders -> ogrenciler.
function _secimDizini(){
  var dersler = {};   // ders_no -> {ad, akts, alanlar[], eksikler[]}

  function kayit(no, ad, akts){
    if (!dersler[no]) dersler[no] = {
      ders_no: no, ders_adi: ad, akts: akts, alanlar: [], eksikler: [] };
    var d = dersler[no];
    if (!d.ders_adi) d.ders_adi = ad;
    if (d.akts === null || d.akts === undefined) d.akts = akts;
    return d;
  }

  OGRENCILER.forEach(function(o){
    (o.secilen_dersler || []).forEach(function(c){
      var aciklama = (c.aciklama || '');
      kayit(c.ders_no, c.ders_adi, c.akts).alanlar.push({
        no: o.no, ad: o.ad, sinif: o.sinif, hedef: o.hedef_donem,
        renk: o.durum_rengi,
        // OBIS "Ders ilk kez aliniyor" ya da tekrar bilgisini yaziyor.
        tekrar: aciklama.toLocaleLowerCase('tr').indexOf('ilk kez') < 0,
        aciklama: aciklama
      });
    });
    // Alttan kalmis, bu donem ACIK ama SECILMEMIS dersler: dersin
    // karsisinda "almasi gerekirdi" diye gorunmeli.
    (o.alttan || []).forEach(function(a){
      if ((a.durum || '').indexOf('SEÇİLMEMİŞ') !== 0) return;
      kayit(a.ders_no, a.ders_adi, a.akts).eksikler.push({
        no: o.no, ad: o.ad, harf: a.harf, yil: a.yil });
    });
  });

  // Katalogdan donem ve kontenjan bilgisini bagla.
  var k = KATALOG || {};
  Object.keys(k).forEach(function(d){
    k[d].forEach(function(c){
      if (dersler[c.ders_no]){
        dersler[c.ders_no].donem = parseInt(d, 10);
        dersler[c.ders_no].doldu = c.doldu;
        dersler[c.ders_no].tip = c.tip;
        if (dersler[c.ders_no].akts === null
            || dersler[c.ders_no].akts === undefined)
          dersler[c.ders_no].akts = c.akts;
      }
    });
  });
  return dersler;
}

// --- Cozulmeli Cakisma --------------------------------------------
// "Kesin degistirilmesi gereken cakismasi olan kisiler." Yalnizca
// cozulmeli=true olanlar; devamsizlik hakkina sigan ya da devam
// zorunlulugu olmayan cakismalar buraya GIRMEZ (onlar zorunlu degil).
function _cozulmeliOgrenciler(){
  return OGRENCILER.map(function(o){
    var liste = (o.cakismalar || []).filter(function(c){
      return c.cozulmeli; });
    return liste.length ? {o: o, cakismalar: liste} : null;
  }).filter(Boolean).sort(function(a, b){
    if (a.cakismalar.length !== b.cakismalar.length)
      return b.cakismalar.length - a.cakismalar.length;  // cok olan once
    return (a.o.ad || '').localeCompare(b.o.ad || '', 'tr');
  });
}

function cozulmeliCiz(){
  var kayitlar = _cozulmeliOgrenciler();
  var h = '<div class="baslik"><h2>Çözülmeli Çakışma</h2>'
    + '<span class="etiket">değiştirilmesi zorunlu</span></div>';

  // "butun cakismalar bu kadar" sanilmasin.
  var hakIci = 0, serbest = 0;
  OGRENCILER.forEach(function(o){
    (o.cakismalar || []).forEach(function(c){
      if (c.cozulmeli) return;
      if (c.hak_ici) hakIci++; else serbest++;
    });

  if (!kayitlar.length){
    h += '<div class="bos">Değiştirilmesi zorunlu çakışma yok.</div>';
    if (hakIci || serbest){
      h += '<p class="aciklama">Panoda '+(hakIci + serbest)+' çakışma '
        + 'daha var ama hiçbiri zorunlu değil: '+hakIci+' tanesi '
        + 'devamsızlık hakkına sığıyor, '+serbest+' tanesinde devam '
        + 'zorunluluğu yok. Ayrıntı öğrenci sayfalarında.</p>';

    + '</dd></div>'
    + '<div><dt>Devamsızlığa sığan</dt><dd>'+hakIci+'</dd></div>'
    + '<div><dt>Devam zorunluluğu yok</dt><dd>'+serbest+'</dd></div>'
    + '</dl>';
  h += '<p class="aciklama">Bu öğrencilerin seçiminde <b>iki dersin de '
    + 'devam zorunluluğu</b> var ve saatleri çakışıyor; ikisine birden '
    + 'girilemez (MADDE 9/1-b). Her çift için hangi dersin yerine '
    + 'hangisinin konabileceği yazıyor. Devamsızlık hakkına sığan '
    + 'çakışmalar ve devam zorunluluğu olmayanlar buraya girmez - '
    + 'onlar zorunlu değil, öğrenci sayfalarında duruyorlar.</p>';
  h += '<div class="ic-arama"><input id="cozulmeli-arama" placeholder="'
    + 'Öğrenci ya da ders ara…" value="'+kacar(cozulmeliArama)+'">'
    + '<span id="cozulmeli-sayac"></span></div>';

function secimGovde(){
  var dizin = _secimDizini();
  var ara = _kucult(secimArama).trim();
  var h = '', gorunen = 0, tumu = 0;

  var kodlar = Object.keys(dizin).sort(function(a, b){
    var x = dizin[a], z = dizin[b];
    var dx = x.donem || 99, dz = z.donem || 99;
    if (dx !== dz) return dx - dz;
    return String(a).localeCompare(String(b), 'tr');
  });

  var grup = {};
  kodlar.forEach(function(kod){
    tumu++;
    var c = dizin[kod];
    // Ders adi/kodu eslesirse dersin TAMAMI gorunur; ogrenci adi
    // eslesirse de ders gorunur (o ogrencinin dersleri suzulmus olur).
    var dersMetni = _kucult(kod + ' ' + (c.ders_adi || ''));
    var kisiMetni = c.alanlar.map(function(a){
      return a.no + ' ' + a.ad; }).join(' ');
    kisiMetni = _kucult(kisiMetni);
    if (ara && dersMetni.indexOf(ara) < 0 && kisiMetni.indexOf(ara) < 0)
      return;
    gorunen++;
    (grup[c.donem || 0] = grup[c.donem || 0] || []).push(c);
  });

  Object.keys(grup).sort(function(a, b){ return a - b; }).forEach(function(d){
    var baslik = (d === '0' || d === 0) ? 'Dönemi belirlenemeyen'
                                        : (d + '. dönem');
    h += '<div class="bolum"><h3>'+baslik+' ('+grup[d].length+' ders)</h3>';
    grup[d].forEach(function(c){
      var satirlar = c.alanlar.slice().sort(function(a, b){
        return (a.ad || '').localeCompare(b.ad || '', 'tr');
      }).map(function(a){
        return '<tr class="satir-secim" data-no="'+kacar(a.no)+'">'
          + '<td class="kod">'+isaretle(a.no, ara)+'</td>'
          + '<td><span class="nokta '+kacar(a.renk || 'bilgi')+'"></span> '
          + isaretle(a.ad, ara)+'</td>'
          + '<td class="sayi">'+sayi(a.sinif, '—')+'</td>'
          + '<td class="sayi">'+sayi(a.hedef, '—')+'</td>'
          + '<td>'+(a.tekrar
              ? '<span class="not kaldi">TEKRAR</span>'
              : '<span class="kod">ilk kez</span>')+'</td></tr>';
      });
      var etiketler = '<span class="kod">'+sayi(c.akts, '?')+' AKTS</span>';
      if (c.tip === 'TOS') etiketler += ' <span class="not dc">TOS</span>';
      else if (c.tip) etiketler += ' <span class="kod">'
        + kacar(c.tip.toLocaleLowerCase('tr'))+'</span>';
      if (c.doldu) etiketler += ' <span class="not kaldi">KONTENJAN DOLU</span>';

      h += '<div class="ders-kutu"><h4>'+isaretle(c.ders_no, ara)
        + ' — '+isaretle(c.ders_adi, ara)
        + ' <span class="sayac-rozet">'
        + (c.alanlar.length ? c.alanlar.length + ' öğrenci'
                            : 'kimse almamış')
        + '</span></h4><div class="ders-etiket">'+etiketler+'</div>';
      // Alan yoksa bos tablo basligi gostermeyelim; ders zaten yalniz
      // "almasi gerekirken secmemis" ogrenci oldugu icin listede.
      if (satirlar.length){
        h += tablo([{ad:'No'},{ad:'Öğrenci'},{ad:'Sınıf',sayi:1},
                    {ad:'Hedef dönem',sayi:1},{ad:'Durum'}], satirlar);
      }
      if (c.eksikler.length){
        h += '<p class="aciklama"><b>Bu dersi alması gerekirken '
          + 'seçmemiş ('+c.eksikler.length+'):</b> '
          + c.eksikler.map(function(e){
              return kacar(e.ad) + ' <span class="kod">' + kacar(e.no)
                + (e.harf ? ' · ' + kacar(e.harf) : '')
                + (e.yil ? ' · ' + kacar(e.yil) : '') + '</span>';
            }).join(', ') + '</p>';
      }
      h += '</div>';
    });
    h += '</div>';
  });

  document.getElementById('secim-sayac').textContent =
    ara ? (gorunen + ' / ' + tumu + ' ders') : (tumu + ' ders');
  document.getElementById('secim-govde').innerHTML = h ||
    '<div class="bos" style="padding:30px;font-size:13px">'
    + 'Eşleşen ders ya da öğrenci yok.</div>';
}

// Danisman gorusmede ogrenciye ne soyleyecegini yazmak zorunda
// kaliyordu. Bu, panodaki uyarilari duz metne cevirip panoya koyuyor;
// e-postaya ya da mesaja oldugu gibi yapistirilabiliyor.
function kopyalanacakMetin(o){
  var s = [];
  s.push(o.ad + '  ' + o.no);
  var p = o.projeksiyon || {};
  if (p.toplam != null)
    s.push('Mezuniyet AKTS projeksiyonu: ' + p.toplam + ' (asgari '
           + (p.asgari || 240) + ')');
  if (o.secilen_akts != null)
    s.push('Bu dönem seçilen: ' + o.secilen_akts + ' AKTS, '
           + (o.secilen_ders_sayisi || 0) + ' ders');
  var yap = (o.uyarilar || []).filter(function(u){
    return u.onem === 'yapilacak'; });
  var dik = (o.uyarilar || []).filter(function(u){
    return u.onem === 'dikkat'; });
  function dok(baslik, liste){
    if (!liste.length) return;
    s.push('');
    s.push(baslik + ' (' + liste.length + ')');
    liste.forEach(function(u){
      s.push('- ' + u.baslik
             + (u.ders_no ? ' [' + u.ders_no + ' ' + (u.ders_adi || '') + ']'
                          : ''));
      s.push('  ' + u.aciklama);
    });
  }
  dok('YAPILMASI GEREKENLER', yap);
  dok('DİKKAT EDİLECEKLER', dik);
  if (!yap.length && !dik.length){
    s.push('');
    s.push('Uyarı üretilmedi.');
  }
  s.push('');
  s.push('(Danışman Özeti — salt okuma ile üretildi, ders eklenmedi '
         + 'veya onaylanmadı.)');
  return s.join(String.fromCharCode(10));
}

function panoyaKoy(metin, dugme){
  function oldu(){
    if (!dugme) return;
    var eski = dugme.textContent;
    dugme.textContent = 'Kopyalandı';
    dugme.classList.add('oldu');
    setTimeout(function(){
      dugme.textContent = eski; dugme.classList.remove('oldu'); }, 1600);
  }
  // Pano dosya olarak (file://) acildiginda navigator.clipboard bazi
  // tarayicilarda calismiyor; eski yontem yedek olarak duruyor.
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(metin).then(oldu, function(){
      eskiYontem(metin, oldu); });
  } else {
    eskiYontem(metin, oldu);
  }
}

function eskiYontem(metin, bitince){
  var a = document.createElement('textarea');
  a.value = metin;
  a.style.position = 'fixed';
  a.style.left = '-9999px';
  document.body.appendChild(a);
  a.select();
  try { document.execCommand('copy'); bitince(); } catch (e) {}
  document.body.removeChild(a);
}

          .map(function(yy){
            return yy + ' girisli: ' + c.kohortlar[yy].eski_akts
              + ' AKTS (' + c.kohortlar[yy].ogrenci_sayisi + ' ogr.)'; });
        notlar.push('<span class="not dc">GIRIS YILINA GORE FARKLI</span> '
          + parca.join(', '));
      }
      if (c.kod_degisti)
        notlar.push('kod degisti, OBIS eski kodu tanimaz');
      if (!c.bu_donem_acik)
        notlar.push('bu donem acik degil');
      else if (c.acik_akts !== null && c.acik_akts !== c.guncel_akts)
        notlar.push('<span class="not kaldi">OBIS ' + c.acik_akts
          + ' AKTS gosteriyor</span>');

      satirlar.push('<tr'+(c.fark ? ' class="vurgulu"' : '')+'>'
        + '<td class="kod">'+kodHucre+'</td>'
        + '<td>'+isaretle(c.ders_adi, ara)+'</td>'
        + '<td class="sayi">'+sayi(c.eski_akts,'-')
        + (c.ana_kohort ? '<br><span class="kod">'+c.ana_kohort
                          + ' gir.</span>' : '')+'</td>'
        + '<td class="sayi">'+sayi(c.guncel_akts,'-')+'</td>'
        + '<td class="sayi">'+farkHucre+'</td>'
        + '<td class="sayi">'+(c.kalan_sayisi || '-')+'</td>'
        + '<td class="kod">'+(notlar.length ? notlar.join('<br>') : '')
        + '</td></tr>');
    });

    var eksik = (kapsam[d] || []).length;
    if (!satirlar.length && !eksik) return;

    h += '<div class="bolum"><h3>'+d+'. yariyil'
      + (satirlar.length ? ' ('+satirlar.length+' ders)' : '')+'</h3>';
    if (satirlar.length){
      h += tablo([{ad:'Kod'},{ad:'Ders'},{ad:'Ilk hali',sayi:1},
                  {ad:'Guncel',sayi:1},{ad:'Fark',sayi:1},
                  {ad:'Kalan ogr.',sayi:1},{ad:'Not'}],
                 satirlar);
    }
    if (eksik){
      h += '<p class="aciklama">Bu yariyilin '+eksik+' dersi hicbir '
        + 'ogrencinin transkriptinde gecmiyor, karsilastirilamadi '
        + '(henuz alinmamis dersler). Guncel AKTS degerleri icin '
        + '<b>Dersler</b> sekmesine bakin.</p>';
    }
    h += '</div>';
  });

  if (!h) h = '<div class="bos">Aramaya uyan ders yok.</div>';
  document.getElementById('akts-govde').innerHTML = h;
  var sc = document.getElementById('akts-sayac');
  if (sc) sc.textContent = gorunen + ' ders gosteriliyor'
    + (aktsHepsi ? '' : ' (' + degisenToplam + ' degisen)');
}

// 60 ogrenci fareyle tek tek tiklanacak bir liste degil. Ok tuslari
// zaten vardi; j/k, "/" ve Esc eklendi - el klavyeden hic kalkmiyor.
document.addEventListener('keydown', function(e){
  var kutuda = document.activeElement
    && (document.activeElement.tagName === 'INPUT'
        || document.activeElement.tagName === 'TEXTAREA');

  if (e.key === 'Escape'){
    if (document.activeElement.id === 'arama'){
      document.getElementById('arama').value = '';
      arama = ''; listeCiz(); document.activeElement.blur();
      e.preventDefault();
    }
    return;
  }
  if (e.key === '/' && !kutuda){
    document.getElementById('arama').focus();
    document.getElementById('arama').select();
    e.preventDefault();
    return;
  }
  var asagi = (e.key === 'ArrowDown' || (e.key === 'j' && !kutuda));
  var yukari = (e.key === 'ArrowUp' || (e.key === 'k' && !kutuda));
  if (!asagi && !yukari) return;
  if (kutuda && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  var g = OGRENCILER.filter(gorunur);
  if (!g.length) return;
  var i = g.findIndex(function(x){ return x.no === secilenNo; });
  i = asagi ? Math.min(i+1, g.length-1) : Math.max(i-1, 0);
  sec(g[i < 0 ? 0 : i].no);
  e.preventDefault();
});
